<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign Up | AlgoVerse</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="signup.css">
</head>

<body>

    <!-- Background animation -->
    <canvas id="particle-canvas"></canvas>

    <!-- Navigation -->
    <header class="navbar">

        <a href="index.html" class="logo">AlgoVerse</a>

        <a href="index.html" class="back-home">
            ← Back to Home
        </a>

    </header>

    <!-- Sign up section -->
    <main class="signup-container">

        <div class="signup-card">

            <div class="signup-icon">✦</div>

            <p class="welcome-text">JOIN THE COMMUNITY</p>

            <h1>Create Account</h1>

            <p class="signup-description">
                Start exploring and visualizing algorithms with AlgoVerse.
            </p>

            <form id="signup-form">

                <label for="name">Full Name</label>

                <input
                    type="text"
                    id="name"
                    placeholder="Enter your full name"
                    required
                >

                <label for="email">Email Address</label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >

                <label for="password">Password</label>

                <input
                    type="password"
                    id="password"
                    placeholder="Create a password"
                    required
                    minlength="8"
                >

                <label for="confirm-password">Confirm Password</label>

                <input
                    type="password"
                    id="confirm-password"
                    placeholder="Enter your password again"
                    required
                    minlength="8"
                >

                <div class="terms">
                    <input type="checkbox" id="terms" required>

                    <label for="terms">
                        I agree to the terms and conditions.
                    </label>
                </div>

                <button type="submit" class="signup-submit">
                    Create Account
                </button>

                <p id="signup-message"></p>

            </form>

            <div class="signup-divider">
                <span>OR</span>
            </div>

            <p class="login-text">
                Already have an account?
                <a href="login.html">Login</a>
            </p>

        </div>

    </main>

    <!-- Footer -->
    <footer class="signup-footer">
        Explore. Visualize. Understand. | © 2026 AlgoVerse
    </footer>

    <!-- Background animation -->
    <script type="module" src="js/main.js"></script>

    <!-- Sign up functionality -->
    <script src="js/signup.js"></script>

</body>

</html>
